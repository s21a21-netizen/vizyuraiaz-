<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d0d11;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
      font-size: 28px;
      letter-spacing: 2px;
    }
    #visualizer {
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
      background: #16161e;
      max-width: 100%;
      height: auto;
    }
    .controls {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    button {
      padding: 14px 32px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
      transition: all 0.2s ease;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(79, 172, 254, 0.6);
    }
    button:disabled {
      background: #333;
      color: #777;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
    .hint {
      font-size: 13px;
      color: #888;
    }
  </style>
</head>
<body>

  <h1>Visualizer</h1>
  <canvas id="visualizer" width="800" height="400"></canvas>
  
  <div class="controls">
    <button id="startButton">画面・音楽を流す音声を共有して開始</button>
    <p class="hint">※ 共有選択時、「Chromeタブ」で音楽を流すタブを選び「タブの音声を共有」をONにしてね！</p>
  </div>

  <script>
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    const startButton = document.getElementById('startButton');

    let audioCtx;
    let analyser;
    let dataArray;
    let source;
    let isPlaying = false;

    startButton.addEventListener('click', async () => {
      if (isPlaying) return;

      try {
        // 画面共有経由でPC音声を取得
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: {
            suppressLocalAudioPlayback: false
          }
        });

        // 音声トラックが含まれているか確認
        const audioTrack = stream.getAudioTracks()[0];
        if (!audioTrack) {
          alert('音声が見つかりませんでした！\n共有時の画面で「タブの音声を共有」にチェックを入れてね。');
          stream.getTracks().forEach(track => track.stop());
          return;
        }

        // Web Audio APIの初期化
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();

        source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);

        analyser.fftSize = 128;
        const bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);

        isPlaying = true;
        startButton.disabled = true;
        startButton.innerText = '解析中... (再生中…)';

        audioTrack.onended = () => {
          isPlaying = false;
          startButton.disabled = false;
          startButton.innerText = '画面・音楽を流す音声を共有して開始';
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        };

        draw();
      } catch (err) {
        console.error(err);
      }
    });

    function draw() {
      if (!isPlaying) return;

      requestAnimationFrame(draw);

      analyser.getByteFrequencyData(dataArray);

      // 背景クリア（残像）
      ctx.fillStyle = 'rgba(22, 22, 30, 0.25)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const barWidth = (canvas.width / dataArray.length) * 2;
      let x = 0;

      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) {
        sum += dataArray[i];
      }
      const average = sum / dataArray.length;

      // 中央のグラデーションリング
      ctx.save();
      ctx.beginPath();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      const radius = average * 0.9 + 30;
      ctx.arc(0, 0, radius, 0, 2 * Math.PI);
      ctx.lineWidth = 4;
      ctx.strokeStyle = `hsl(${(average * 4) % 360}, 100%, 65%)`;
      ctx.stroke();
      ctx.restore();

      // スペクトラムバー
      for (let i = 0; i < dataArray.length; i++) {
        const barHeight = dataArray[i] * 1.3;
        const hue = (i / dataArray.length) * 280 + 160; 
        ctx.fillStyle = `hsl(${hue}, 100%, 60%)`;

        const centerY = canvas.height / 2;
        ctx.fillRect(x, centerY - barHeight / 2, barWidth - 3, barHeight);

        x += barWidth + 1;
      }
    }
  </script>
</body>
</html>
