<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Pitch Visualizer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d0d11;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
      font-size: 28px;
      letter-spacing: 2px;
    }
    .piano-container {
      position: relative;
      width: 800px;
      height: 260px;
      background: #1e1e24;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      overflow: hidden;
    }
    #piano {
      position: relative;
      display: flex;
      height: 100%;
      width: 100%;
    }
    .key {
      position: relative;
      flex: 1;
      background: #ffffff;
      border: 1px solid #000;
      border-radius: 0 0 6px 6px;
      box-sizing: border-box;
      transition: background 0.05s, transform 0.05s;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 12px;
      color: #333;
      font-size: 12px;
      font-weight: bold;
      user-select: none;
    }
    .key.active {
      background: #00f2fe !important;
      box-shadow: 0 0 20px #00f2fe;
      transform: translateY(4px);
      color: #fff;
    }
    .key.black {
      position: absolute;
      height: 60%;
      width: 6%;
      background: #222;
      border-radius: 0 0 4px 4px;
      z-index: 2;
      color: #fff;
      font-size: 10px;
      padding-bottom: 6px;
    }
    .key.black.active {
      background: #ff007f !important;
      box-shadow: 0 0 20px #ff007f;
    }
    .controls {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    button {
      padding: 14px 32px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
      transition: all 0.2s ease;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(79, 172, 254, 0.6);
    }
    button:disabled {
      background: #333;
      color: #777;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
    .note-display {
      font-size: 20px;
      font-weight: bold;
      color: #00f2fe;
      min-height: 28px;
    }
    .hint {
      font-size: 13px;
      color: #888;
    }
  </style>
</head>
<body>

  <h1>Visualizer (耳コピモード)</h1>
  
  <div class="piano-container">
    <div id="piano"></div>
  </div>

  <div class="controls">
    <div class="note-display" id="noteDisplay">検出音: --</div>
    <button id="startButton">画面・音楽を流す音声を共有して開始</button>
    <p class="hint">※ 共有選択時、「Chromeタブ」で音楽を流すタブを選び「タブの音声を共有」をONにしてね！</p>
  </div>

  <script>
    const pianoEl = document.getElementById('piano');
    const noteDisplay = document.getElementById('noteDisplay');
    const startButton = document.getElementById('startButton');

    const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    // C3 (48) から B5 (83) までの鍵盤を作成
    const START_NOTE = 48; 
    const END_NOTE = 83;

    const keysMap = {};

    // 鍵盤のDOMを生成
    function createPiano() {
      let whiteIndex = 0;
      const totalWhiteKeys = 21; // 3オクターブ分

      for (let note = START_NOTE; note <= END_NOTE; note++) {
        const isBlack = [1, 3, 6, 8, 10].includes(note % 12);
        const keyEl = document.createElement('div');
        const noteName = NOTE_NAMES[note % 12] + Math.floor(note / 12 - 1);
        
        keyEl.classList.add('key');
        keyEl.innerText = noteName;
        keyEl.dataset.note = note;

        if (isBlack) {
          keyEl.classList.add('black');
          // 黒鍵の位置調整
          const leftPos = (whiteIndex / totalWhiteKeys) * 100 - 3;
          keyEl.style.left = `${leftPos}%`;
        } else {
          whiteIndex++;
        }

        pianoEl.appendChild(keyEl);
        keysMap[note] = keyEl;
      }
    }

    createPiano();

    let audioCtx;
    let analyser;
    let buffer;
    let isPlaying = false;

    startButton.addEventListener('click', async () => {
      if (isPlaying) return;

      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: { suppressLocalAudioPlayback: false }
        });

        const audioTrack = stream.getAudioTracks()[0];
        if (!audioTrack) {
          alert('音声が見つかりませんでした！\n共有時に「タブの音声を共有」をONにしてね。');
          stream.getTracks().forEach(track => track.stop());
          return;
        }

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048; // ピッチ検出精度を上げるため大きめに設定

        const source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);

        buffer = new Float32Array(analyser.fftSize);

        isPlaying = true;
        startButton.disabled = true;
        startButton.innerText = '耳コピ解析中...';

        audioTrack.onended = () => {
          isPlaying = false;
          startButton.disabled = false;
          startButton.innerText = '画面・音楽を流す音声を共有して開始';
          noteDisplay.innerText = '検出音: --';
          clearActiveKeys();
        };

        detectPitch();
      } catch (err) {
        console.error(err);
      }
    });

    function clearActiveKeys() {
      Object.values(keysMap).forEach(key => key.classList.remove('active'));
    }

    // 自己相関法によるピッチ（周波数）検出アルゴリズム
    function autoCorrelate(buf, sampleRate) {
      let SIZE = buf.length;
      let rms = 0;

      for (let i = 0; i < SIZE; i++) {
        let val = buf[i];
        rms += val * val;
      }
      rms = Math.sqrt(rms / SIZE);

      // 音量が小さすぎる場合は判定しない
      if (rms < 0.01) return -1;

      let r1 = 0, r2 = SIZE - 1, thres = 0.2;
      for (let i = 0; i < SIZE / 2; i++) {
        if (Math.abs(buf[i]) < thres) { r1 = i; break; }
      }
      for (let i = 1; i < SIZE / 2; i++) {
        if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
      }

      buf = buf.slice(r1, r2);
      SIZE = buf.length;

      let c = new Array(SIZE).fill(0);
      for (let i = 0; i < SIZE; i++) {
        for (let j = 0; j < SIZE - i; j++) {
          c[i] = c[i] + buf[j] * buf[j + i];
        }
      }

      let d = 0;
      while (c[d] > c[d + 1]) d++;
      let maxval = -1, maxpos = -1;

      for (let i = d; i < SIZE; i++) {
        if (c[i] > maxval) {
          maxval = c[i];
          maxpos = i;
        }
      }

      let T0 = maxpos;
      return sampleRate / T0;
    }

    // 周波数(Hz) から MIDIノート番号への変換
    function autoCorrelateToNote(freq) {
      const noteNum = 12 * (Math.log(freq / 440) / Math.log(2)) + 69;
      return Math.round(noteNum);
    }

    function detectPitch() {
      if (!isPlaying) return;

      analyser.getFloatTimeDomainData(buffer);
      const pitch = autoCorrelate(buffer, audioCtx.sampleRate);

      clearActiveKeys();

      if (pitch !== -1) {
        const midiNote = autoCorrelateToNote(pitch);
        
        if (keysMap[midiNote]) {
          keysMap[midiNote].classList.add('active');
          const noteName = NOTE_NAMES[midiNote % 12] + Math.floor(midiNote / 12 - 1);
          noteDisplay.innerText = `検出音: ${noteName} (${Math.round(pitch)} Hz)`;
        } else {
          noteDisplay.innerText = `検出音: 音域外 (${Math.round(pitch)} Hz)`;
        }
      } else {
        noteDisplay.innerText = '検出音: --';
      }

      requestAnimationFrame(detectPitch);
    }
  </script>
</body>
</html>
